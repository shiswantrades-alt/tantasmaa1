<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aylatelier: handmade party dresses and sets for girls, sewn in Cairo. أيلاتيليه: فساتين وأطقم بناتي هاند ميد من القاهرة.">
<meta name="theme-color" content="#7a2438">
<link rel="icon" href="img/t/logo.jpg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Aylatelier</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&family=El+Messiri:wght@500;600;700&family=Tajawal:wght@300;400;500;700&display=swap');

:root{
  --wine:#7a2438; --wine-deep:#5f1b2b; --rose:#c2788c; --rose-soft:#e7bcc7;
  --blush:#f6ebeb; --cream:#fbf6f2; --ink:#3a2a2e; --muted:#907a80;
  --gold:#c2a04d; --line:#efdede; --white:#fff; --ok:#3f8f6b;
  --shadow:0 10px 30px rgba(122,36,56,.10); --shadow-sm:0 4px 14px rgba(122,36,56,.08);
  --radius:16px; --maxw:1240px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream); color:var(--ink);
  font-family:'Jost',system-ui,Arial,sans-serif; font-size:16px; line-height:1.55;
  overflow-x:hidden;
}
body.ar{font-family:'Tajawal',system-ui,Arial,sans-serif; line-height:1.8}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif; font-weight:600; line-height:1.15; letter-spacing:.2px}
body.ar h1, body.ar h2, body.ar h3, body.ar .serif{font-family:'El Messiri',serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--wine);color:#fff;border-radius:999px;padding:13px 26px;font-weight:500;font-size:15px;transition:.2s;white-space:nowrap}
.btn:hover{background:var(--wine-deep);transform:translateY(-1px)}
.btn.alt{background:#fff;color:var(--wine);border:1.5px solid var(--wine)}
.btn.alt:hover{background:var(--blush)}
.btn.wa{background:#25823f}
.btn.wa:hover{background:#1d6a33}
.btn.block{width:100%}
.btn.sm{padding:9px 16px;font-size:14px}
.muted{color:var(--muted)}
.center{text-align:center}
.eyebrow{color:var(--rose);letter-spacing:3px;text-transform:uppercase;font-size:12px;font-weight:600}
body.ar .eyebrow{letter-spacing:1px}
section{padding:64px 0}
.sec-head{max-width:640px;margin:0 auto 40px;text-align:center}
.sec-head h2{font-size:clamp(28px,4vw,42px);margin:10px 0 8px}
.sec-head p{color:var(--muted);margin:0}

/* announcement */
.announce{background:var(--wine);color:#fbe7ec;text-align:center;font-size:13px;letter-spacing:.4px;padding:8px 14px}
.announce b{color:#fff}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(251,246,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:74px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand img{height:46px;width:auto;border-radius:8px}
.brand .bt{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;color:var(--wine);line-height:1}
.brand .bt small{display:block;font-family:'Jost',sans-serif;font-weight:400;font-size:9.5px;letter-spacing:4px;color:var(--rose);text-transform:uppercase}
body.ar .brand .bt small{letter-spacing:1px;font-family:'Tajawal',sans-serif}
nav.links{display:flex;gap:22px;margin-inline:auto;font-size:15px;font-weight:500}
nav.links a{padding:6px 2px;position:relative;color:var(--ink);opacity:.85;transition:.2s}
nav.links a:hover{opacity:1;color:var(--wine)}
nav.links a::after{content:"";position:absolute;inset-inline-start:0;bottom:-2px;height:2px;width:0;background:var(--wine);transition:.25s}
nav.links a:hover::after{width:100%}
.tools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.icon-btn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;transition:.2s;position:relative;color:var(--ink)}
.icon-btn:hover{background:var(--blush);color:var(--wine)}
.icon-btn svg{width:21px;height:21px}
.lang-toggle{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--wine);transition:.2s;display:flex;align-items:center;gap:6px}
.lang-toggle:hover{border-color:var(--rose);background:var(--blush)}
.cart-count{position:absolute;top:2px;inset-inline-end:2px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 4px;font-family:'Jost',sans-serif}
.hamb{display:none}

/* hero */
.hero{position:relative;background:linear-gradient(135deg,#f7ecec 0%,#efd9df 100%);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding-top:56px;padding-bottom:56px}
.hero-copy .eyebrow{margin-bottom:14px;display:block}
.hero-copy h1{font-size:clamp(34px,5.2vw,60px);margin:0 0 18px;color:var(--wine-deep)}
.hero-copy p{font-size:18px;color:#6b555a;max-width:460px;margin:0 0 28px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-media{position:relative;aspect-ratio:4/3.4;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.hero-media img{width:100%;height:100%;object-fit:cover}
.hero-badge{position:absolute;bottom:16px;inset-inline-start:16px;background:rgba(255,255,255,.94);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:10px}
.hero-badge .em{font-family:'Playfair Display',serif;color:var(--wine);font-size:22px;line-height:1}
body.ar .hero-badge .em{font-family:'El Messiri',serif}
.hero-badge small{color:var(--muted);font-size:12px}

/* trust */
.trust{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:26px 22px}
.trust-item{display:flex;align-items:center;gap:12px;justify-content:center}
.trust-item svg{width:26px;height:26px;color:var(--wine);flex-shrink:0}
.trust-item b{display:block;font-size:14px}
.trust-item small{color:var(--muted);font-size:12.5px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.cat{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:3/3.6;box-shadow:var(--shadow-sm);cursor:pointer;background:#eadfe0}
.cat img{width:100%;height:100%;object-fit:cover;transition:.5s}
.cat:hover img{transform:scale(1.06)}
.cat .lab{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:linear-gradient(to top,rgba(58,20,30,.72),rgba(58,20,30,0) 55%);color:#fff}
.cat .lab b{font-family:'Playfair Display',serif;font-size:21px}
body.ar .cat .lab b{font-family:'El Messiri',serif}
.cat .lab span{font-size:13px;opacity:.85}

/* shop */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:26px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;color:var(--ink);transition:.2s}
.chip:hover{border-color:var(--rose)}
.chip.active{background:var(--wine);color:#fff;border-color:var(--wine)}
.toolbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;background:#fff}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{border:none;outline:none;font-family:inherit;font-size:14px;width:150px;background:none;color:var(--ink)}
select.sort{border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:.25s;cursor:pointer;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:#efe6e6}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:.5s}
.card:hover .ph img{transform:scale(1.05)}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--wine);color:#fff;font-size:11px;font-weight:600;letter-spacing:.5px;padding:5px 11px;border-radius:999px;text-transform:uppercase}
.badge.new{background:var(--rose)}
.badge.sig{background:var(--gold);color:#3a2a2e}
.quick{position:absolute;bottom:10px;inset-inline:10px;background:rgba(255,255,255,.96);color:var(--wine);font-weight:600;font-size:14px;border-radius:999px;padding:11px;text-align:center;opacity:0;transform:translateY(8px);transition:.25s;box-shadow:var(--shadow-sm)}
.card:hover .quick{opacity:1;transform:none}
.card .info{padding:14px 16px 18px}
.card .info .cat-tag{font-size:11.5px;color:var(--rose);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.card .info h3{font-size:17px;margin:5px 0 3px;font-family:'Playfair Display',serif}
body.ar .card .info h3{font-family:'El Messiri',serif}
.card .info .price{font-weight:600;color:var(--wine);font-size:16px;font-family:'Jost',sans-serif}
.card .info .swatch{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.12);vertical-align:middle;margin-inline-end:5px}

/* lookbook */
.lookbook{background:var(--blush)}
.look-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.look{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);position:relative;aspect-ratio:3/2.6;background:#eadfe0}
.look img{width:100%;height:100%;object-fit:cover;transition:.5s}
.look:hover img{transform:scale(1.05)}
.look .cap{position:absolute;bottom:0;inset-inline:0;padding:18px;background:linear-gradient(to top,rgba(58,20,30,.7),transparent);color:#fff;font-family:'Playfair Display',serif;font-size:19px}
body.ar .look .cap{font-family:'El Messiri',serif}

/* about */
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.about-media{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3.2}
.about-media img{width:100%;height:100%;object-fit:cover}
.about h2{font-size:clamp(26px,3.6vw,38px);margin:8px 0 16px;color:var(--wine-deep)}
.about p{color:#6b555a;margin:0 0 14px}
.about .stats{display:flex;gap:30px;margin-top:22px}
.about .stats .n{font-family:'Playfair Display',serif;font-size:30px;color:var(--wine)}
body.ar .about .stats .n{font-family:'El Messiri',serif}
.about .stats small{color:var(--muted);font-size:13px}

/* newsletter */
.nav-custom{color:var(--wine)!important;font-weight:600;opacity:1!important}
.nav-custom::before{content:"✦";margin-inline-end:6px;color:var(--gold);font-size:12px}
.custom{background:linear-gradient(135deg,#f5e4ea 0%,#efd3dc 55%,#ecc9d7 100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.custom-inner{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding-top:60px;padding-bottom:60px}
.custom-badge{display:inline-flex;align-items:center;gap:6px;background:var(--wine);color:#fff;border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:600;letter-spacing:.5px;margin-bottom:14px}
body.ar .custom-badge{letter-spacing:0}
.custom-copy h2{font-size:clamp(30px,4.6vw,50px);color:var(--wine-deep);margin:4px 0 14px;line-height:1.1}
.custom-copy .lead{font-size:17px;color:#6b4a52;max-width:520px;margin:0 0 24px}
.custom-points{display:flex;flex-direction:column;gap:13px;margin-bottom:28px}
.custom-points>div{display:flex;align-items:center;gap:13px;font-size:15.5px;font-weight:500;color:#4a3238}
.custom-points .ck{width:30px;height:30px;border-radius:999px;background:#fff;color:var(--wine);display:grid;place-items:center;flex-shrink:0;box-shadow:var(--shadow-sm)}
.custom-points .ck svg{width:16px;height:16px}
.custom-cta{display:flex;gap:12px;flex-wrap:wrap}
.custom-media{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3.5;background:#efe0e6}
.custom-media img{width:100%;height:100%;object-fit:cover}
.custom-media .tagpill{position:absolute;top:14px;inset-inline-start:14px;background:rgba(255,255,255,.94);color:var(--wine);border-radius:999px;padding:8px 15px;font-weight:600;font-size:12.5px;box-shadow:var(--shadow-sm)}
.news{background:linear-gradient(135deg,var(--wine),var(--wine-deep));color:#fff;text-align:center}
.news h2{color:#fff;font-size:clamp(26px,3.6vw,38px);margin:0 0 10px}
.news p{color:#f0d6dd;margin:0 auto 24px;max-width:480px}
.news form{display:flex;gap:10px;max-width:460px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.news input{flex:1;min-width:220px;border:none;border-radius:999px;padding:14px 20px;font-family:inherit;font-size:15px;outline:none}
.news .btn{background:#fff;color:var(--wine)}
.news .btn:hover{background:var(--rose-soft)}

/* footer */
footer.site{background:#2a1418;color:#e9d6da;padding:56px 0 24px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:34px;margin-bottom:34px}
.foot-grid h4{color:#fff;font-family:'Jost',sans-serif;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 16px}
body.ar .foot-grid h4{font-family:'Tajawal',sans-serif;letter-spacing:.5px}
.foot-grid a,.foot-grid p{color:#d8bfc5;font-size:14.5px;margin:0 0 10px;transition:.2s;display:block}
.foot-grid a:hover{color:#fff}
.foot-brand .bt{font-family:'Playfair Display',serif;font-size:26px;color:#fff;margin-bottom:10px}
body.ar .foot-brand .bt{font-family:'El Messiri',serif}
.socials{display:flex;gap:10px;margin-top:8px}
.socials a{width:38px;height:38px;border-radius:999px;background:rgba(255,255,255,.09);display:grid;place-items:center}
.socials a:hover{background:var(--rose)}
.socials svg{width:18px;height:18px}
.pay{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pay span{background:rgba(255,255,255,.09);border-radius:7px;padding:6px 10px;font-size:11.5px;color:#e9d6da}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:#b79aa1}

/* drawer + overlay */
.overlay{position:fixed;inset:0;background:rgba(40,15,22,.5);opacity:0;visibility:hidden;transition:.3s;z-index:90;backdrop-filter:blur(2px)}
.overlay.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;inset-inline-end:0;height:100%;width:min(420px,100%);background:var(--cream);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);box-shadow:-10px 0 40px rgba(0,0,0,.15);pointer-events:none}
[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.open,[dir="rtl"] .drawer.open{transform:translateX(0);pointer-events:auto}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer-head h3{margin:0;font-size:20px}
.drawer-body{flex:1;overflow-y:auto;padding:14px 22px}
.drawer-foot{border-top:1px solid var(--line);padding:18px 22px;background:#fff}
.close-x{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--blush);color:var(--wine)}
.close-x:hover{background:var(--rose-soft)}
.close-x svg{width:20px;height:20px}

/* cart line */
.cart-line{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-line .thumb{width:74px;height:92.5px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#efe6e6}
.cart-line .thumb img{width:100%;height:100%;object-fit:cover}
.cart-line .cl-info{flex:1;min-width:0}
.cart-line .cl-info b{font-family:'Playfair Display',serif;font-size:15.5px;font-weight:600;display:block}
body.ar .cart-line .cl-info b{font-family:'El Messiri',serif}
.cart-line .cl-info small{color:var(--muted);font-size:13px}
.cart-line .cl-price{color:var(--wine);font-weight:600;margin-top:4px;font-family:'Jost',sans-serif}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.qty button{width:30px;height:30px;font-size:17px;color:var(--wine);display:grid;place-items:center}
.qty button:hover{background:var(--blush)}
.qty span{min-width:30px;text-align:center;font-size:14px;font-family:'Jost',sans-serif}
.remove{color:var(--muted);font-size:12.5px;margin-top:8px;display:inline-block}
.remove:hover{color:var(--wine)}
.cart-empty{text-align:center;padding:50px 10px;color:var(--muted)}
.cart-empty svg{width:56px;height:56px;color:var(--rose-soft);margin-bottom:14px}
.sumline{display:flex;justify-content:space-between;margin-bottom:9px;font-size:15px}
.sumline.total{font-size:20px;font-weight:600;color:var(--wine);border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-family:'Playfair Display',serif}
body.ar .sumline.total{font-family:'El Messiri',serif}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.3s}
.modal.open{opacity:1;visibility:visible}
.modal-card{background:var(--cream);border-radius:22px;max-width:920px;width:100%;max-height:90vh;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3);transform:translateY(16px) scale(.98);transition:.3s;display:flex;flex-direction:column}
.modal.open .modal-card{transform:none}
.modal-scroll{overflow-y:auto}
.pd{display:grid;grid-template-columns:1fr 1fr}
.pd-media{background:#efe6e6;aspect-ratio:3/3.7}
.pd-media img{width:100%;height:100%;object-fit:cover}
.pd-info{padding:30px 32px;position:relative}
.pd-info .cat-tag{color:var(--rose);text-transform:uppercase;letter-spacing:1.5px;font-size:12px;font-weight:600}
.pd-info h2{font-size:30px;margin:8px 0 6px;color:var(--wine-deep)}
.pd-price{font-size:24px;color:var(--wine);font-weight:600;font-family:'Jost',sans-serif;margin-bottom:14px}
.pd-desc{color:#6b555a;font-size:15px;margin-bottom:18px}
.pd-row{margin-bottom:16px}
.pd-row .lbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.pd-row .lbl a{color:var(--wine);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;cursor:pointer;text-decoration:underline}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;background:#fff;transition:.15s;font-family:'Jost',sans-serif}
.size:hover{border-color:var(--rose)}
.size.active{background:var(--wine);color:#fff;border-color:var(--wine)}
.fabric{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.fabric span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px}
.pd-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.pd-actions .btn{flex:1;min-width:150px}
.modal-close{position:absolute;top:14px;inset-inline-end:14px;z-index:3}

/* size guide table */
.sg-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.sg-table th,.sg-table td{border:1px solid var(--line);padding:10px 12px;text-align:center;font-family:'Jost',sans-serif}
.sg-table th{background:var(--blush);color:var(--wine);font-weight:600}
body.ar .sg-table th, body.ar .sg-table td{font-family:'Tajawal',sans-serif}

/* checkout */
.co-field{margin-bottom:14px}
.co-field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.co-field input,.co-field select,.co-field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:15px;outline:none;background:#fff;color:var(--ink);transition:.15s}
.co-field input:focus,.co-field select:focus,.co-field textarea:focus{border-color:var(--rose)}

/* ---------- sizes & pricing ----------
   Sizes run 2-3 up to 8-9 only. Each size step up adds SIZE_STEP EGP.
   `price` on a product = the price of the smallest size (2-3). */
const SIZES = ["2-3","4-5","6-7","8-9"];
const SIZE_STEP = 100;
function priceFor(p,size){ const i=SIZES.indexOf(size); return p.price + (i<0?0:i)*SIZE_STEP; }
function maxPrice(p){ return priceFor(p,SIZES[SIZES.length-1]); }

/* ---------- product helpers ---------- */
function colorsOf(p){ return p.colors||[]; }
function colorInfo(key){ return COLORS[key]||{en:key,ar:key,hex:"#ddd"}; }
function colorName(key){
  if(!key) return "";
  if(key.startsWith("other:")) return key.slice(6);
  return colorInfo(key)[lang];
}
function defaultColor(p){ return colorsOf(p).find(c=>c.img&&c.img.length)||colorsOf(p)[0]; }
function coverKey(p){ const d=defaultColor(p); return d&&d.img?d.img[0]:"logo"; }
function imgsFor(p,ckey){
  const c=colorsOf(p).find(x=>x.c===ckey);
  if(c&&c.img&&c.img.length) return {imgs:c.img,pictured:true};
  const d=defaultColor(p); return {imgs:d&&d.img?d.img:[coverKey(p)],pictured:false,shown:d?d.c:null};
}
function IMG(k){ return "img/"+k+".jpg"; }
function TH(k){ return "img/t/"+k+".jpg"; }
function viewLabel(k){ return /_fb$/.test(k)?t('frontBack'):/_f$/.test(k)?t('front'):/_b$/.test(k)?t('back'):""; }

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = STR[lang].dir;
  document.body.classList.toggle("ar", lang==="ar");

}
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{

/* ---------- navigation ---------- */
function goto(where, filter){
  closeMenu();
  if(document.body.classList.contains("pd-open")){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} hideProductPage(); }
  if(where==="shop" && filter){ curFilter=filter; renderFilters(); renderProducts(); }
  const map={top:"top",shop:"shop",custom:"custom",lookbook:"lookbook",about:"about",contact:"contact"};
  const el=document.getElementById(map[where]||"top");

function badgeHtml(p){

  return p.badge==="best"?`<span class="badge">${info.tag}</span>`

    : p.badge==="sig"?`<span class="badge sig">${info.tag}</span>`:"";

function dotsHtml(p,max){
  const cs=colorsOf(p); max=max||6;
  let h=cs.slice(0,max).map(c=>`<span class="dot" style="background:${colorInfo(c.c).hex}" title="${colorName(c.c)}"></span>`).join("");

  if(p.anyColor) h+=`<span class="dot-any" title="${t('anyColor')}">+</span>`;

function renderProducts(){
  let list = PRODUCTS.filter(p=>curFilter==="all"||p.cat===curFilter);
  if(curSearch.trim()){
    const q=curSearch.trim().toLowerCase();
    list=list.filter(p=>(p.en.name+" "+p.ar.name+" "+colorsOf(p).map(c=>colorInfo(c.c).en+" "+colorInfo(c.c).ar).join(" ")).toLowerCase().includes(q));
  }
  if(curSort==="low") list=[...list].sort((a,b)=>a.price-b.price);
  if(curSort==="high") list=[...list].sort((a,b)=>b.price-a.price);
  const grid=document.getElementById("grid");
  if(!list.length){ grid.innerHTML=`<p class="muted" style="grid-column:1/-1;text-align:center;padding:40px">${lang==='ar'?'لا توجد نتائج':'No results'}</p>`; return; }

function pickColor(c){
  pdColor=c; pdIdx=0; renderProductPage(); setHashSilently();

}
function pickSize(s){ pdSize=s; renderProductPage(); }
function pdQtyStep(d){ pdQty=Math.max(1,Math.min(20,pdQty+d)); renderProductPage(); }
function gGo(i){
  pdIdx=(i+pdImgs.length)%pdImgs.length;
  document.querySelectorAll("#gMain .g-img").forEach((el,j)=>el.classList.toggle("on",j===pdIdx));
  document.querySelectorAll(".g-thumbs .g-th").forEach((el,j)=>el.classList.toggle("on",j===pdIdx));
  const v=document.getElementById("gView"); if(v) v.textContent=viewLabel(pdImgs[pdIdx]);
  const c=document.getElementById("gCount"); if(c) c.textContent=`${pdIdx+1} / ${pdImgs.length}`;
}
function gStep(d){ gGo(pdIdx + d); }
function bindSwipe(){
  const el=document.getElementById("gMain"); if(!el||pdImgs.length<2) return;
  let x0=null;
  el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
  el.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) gGo(pdIdx+(dx<0?1:-1)); x0=null; },{passive:true});
}
function currentColorKey(){
  if(pdColor==="other"){ const v=(pdOther||"").trim(); return v?("other:"+v):null; }
  return pdColor;
}
function addFromPage(){
  if(!pdSize){ toast(t('pickSizeFirst')); return; }
  const ck=currentColorKey();
  if(!ck){ toast(t('typeColorFirst')); const i=document.getElementById("otherInput"); if(i) i.focus(); return; }
  addToCart(pdCurrent,pdSize,pdQty,ck);
}
function waHref(){
  const p=prod(pdCurrent); const info=P(p);
  const ck=currentColorKey();
  const parts=[];
  if(ck) parts.push(`${t('color')}: ${colorName(ck)}`);
  if(pdSize) parts.push(`${t('size')}: ${pdSize}`);
  const price = pdSize?money(priceFor(p,pdSize)*pdQty):`${money(p.price)} – ${money(maxPrice(p))}`;
  const msg = (lang==='ar'
    ? `مرحباً أيلاتيليه 💗\nأودّ طلب: ${info.name}\n${parts.join(" · ")}${pdSize?`\nالكمية: ${pdQty}`:""}\nالسعر: ${price}`
    : `Hi Aylatelier 💗\nI'd like to order: ${info.name}\n${parts.join(" · ")}${pdSize?`\nQty: ${pdQty}`:""}\nPrice: ${price}`);
  return `https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(msg)}`;
}

function lbStep(d){ lbIdx=(lbIdx+d+pdImgs.length)%pdImgs.length; renderLightbox(); gGo(lbIdx); }
function closeLightbox(){ document.getElementById("lightbox").classList.remove("open"); }

/* ---------- cart ---------- */
function lineKey(i){ return i.id+"|"+i.size+"|"+(i.color||""); }
function addToCart(id,size,qty,color){
  color=color||"";
  const ex=cart.find(i=>i.id===id&&i.size===size&&(i.color||"")===color);
  if(ex) ex.qty+=qty; else cart.push({id,size,color,qty});
  save(); updateCartCount(); renderCart();
  toast(t('addedToCart')); pulseCart();
}
function changeQty(idx,d){
  const it=cart[idx]; if(!it) return;
  it.qty+=d; if(it.qty<=0) cart.splice(idx,1);
  save(); updateCartCount(); renderCart();
}
function removeItem(idx){ cart.splice(idx,1); save(); updateCartCount(); renderCart(); }
function linePrice(i){ return priceFor(prod(i.id),i.size); }
function cartSubtotal(){ return cart.reduce((s,i)=>s+linePrice(i)*i.qty,0); }
function cartCount(){ return cart.reduce((s,i)=>s+i.qty,0); }
function updateCartCount(){ ["cartCount","cartCount2"].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=cartCount(); }); }
function pulseCart(){ ["cartCount","cartCount2"].forEach(id=>{ const el=document.getElementById(id); if(el&&el.offsetParent) el.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:350}); }); }
function lineThumb(i){
  const p=prod(i.id);
  const k = (i.color&&!i.color.startsWith("other:")) ? imgsFor(p,i.color).imgs[0] : coverKey(p);
  return TH(k);
}
function renderCart(){
  const body=document.getElementById("cartBody"), foot=document.getElementById("cartFoot");
  if(!cart.length){
    body.innerHTML=`<div class="cart-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><h3 style="margin:0 0 4px">${t('cartEmpty')}</h3><p style="margin:0">${t('cartEmptySub')}</p></div>`;
    foot.innerHTML=`<button class="btn block alt" onclick="closeCart()">${t('continueShop')}</button>`;
    return;
  }
  body.innerHTML = cart.map((i,idx)=>{
    const p=prod(i.id), info=P(p);
    const sw = i.color && !i.color.startsWith("other:") ? `<span class="swatch" style="background:${colorInfo(i.color).hex}"></span>` : "";
    return `<div class="cart-line">
      <a class="thumb" href="${pHash(i.id,i.color&&!i.color.startsWith('other:')?i.color:'')}" onclick="closeCart();pdFromApp=true"><img src="${lineThumb(i)}" alt=""></a>
      <div class="cl-info">
        <b>${info.name}</b>
        ${i.color?`<small>${sw}${t('color')}: ${colorName(i.color)}</small><br>`:""}
        <small>${t('size')}: ${i.size} ${t('yrs')}</small>
        <div class="cl-price">${money(linePrice(i)*i.qty)}${i.qty>1?` <span class="muted small">(${money(linePrice(i))} × ${i.qty})</span>`:""}</div>
        <div class="qty">
          <button onclick="changeQty(${idx},-1)">−</button>
          <span>${i.qty}</span>
          <button onclick="changeQty(${idx},1)">+</button>
        </div>
        <div><a class="remove" onclick="removeItem(${idx})">${lang==='ar'?'إزالة':'Remove'}</a></div>
      </div>
    </div>`;
  }).join("");
  foot.innerHTML = `
    <div class="sumline"><span>${t('subtotal')}</span><b>${money(cartSubtotal())}</b></div>
    <div class="sumline muted"><span>${t('shipping')}</span><span>${t('shipAtCheckout')}</span></div>
    <button class="btn block" style="margin-top:8px" onclick="openCheckout()">${t('checkout')} · ${money(cartSubtotal())}</button>`;
}

/* ---------- checkout ---------- */
function openCheckout(){
  if(!cart.length){ toast(t('cartEmpty')); return; }
  closeCart();
  coPayment="cod";
  renderCheckout();
  showModal("checkoutModal");
}
function renderCheckout(){
  const govOpts = `<option value="">${t('selectGov')}</option>` + GOV.map((g,i)=>`<option value="${i}">${g[lang]}</option>`).join("");
  document.getElementById("coTitle").textContent=t('checkout');
  document.getElementById("coBody").innerHTML = `
    <div style="font-weight:600;margin-bottom:12px">${t('coContact')}</div>
    <div class="co-field"><label>${t('fullName')}</label><input id="coName" autocomplete="name"></div>
    <div class="co-field"><label>${t('phone')}</label><input id="coPhone" dir="ltr" inputmode="tel" placeholder="+20 10 1234 5678" autocomplete="tel"></div>
    <div class="co-2">
      <div class="co-field"><label>${t('gov')}</label><select id="coGov" onchange="renderCoSummary()">${govOpts}</select></div>
      <div class="co-field"><label>${t('cityArea')}</label><input id="coCity"></div>
    </div>
    <div class="co-field"><label>${t('address')}</label><input id="coAddr" autocomplete="street-address"></div>
    <div class="co-field"><label>${t('notes')}</label><textarea id="coNotes" rows="2" placeholder="${t('notesPh')}"></textarea></div>

    <div style="font-weight:600;margin:18px 0 12px">${t('payMethod')}</div>
    <div class="pay-opts" id="payOpts">
      ${payOpt('cod','cod','codSub','<path d="M2 7h20v10H2z"/><circle cx="12" cy="12" r="2.5"/>')}
      ${payOpt('wallet','wallet','walletSub','<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M16 12h2"/>')}
      ${payOpt('instapay','instapay','instapaySub','<path d="M3 12h18M12 3v18"/>')}
      ${payOpt('card','cardDel','cardDelSub','<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>')}
    </div>

    <div style="font-weight:600;margin:18px 0 10px">${t('orderSummary')}</div>
    <div id="coSummary"></div>
    <button class="btn block" style="margin-top:16px" onclick="placeOrder()">${t('placeOrder')}</button>
    <p class="muted" style="font-size:12.5px;text-align:center;margin:10px 0 0">${t('madeNote')}</p>`;
  renderCoSummary();
}
function payOpt(val,tk,sk,ic){
  return `<label class="pay-opt ${coPayment===val?'active':''}" onclick="setPay('${val}')">
    <input type="radio" name="pay" ${coPayment===val?'checked':''}>
    <span class="po-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${ic}</svg></span>
    <span><b>${t(tk)}</b><small>${t(sk)}</small></span>
  </label>`;
}
function setPay(v){ coPayment=v; document.querySelectorAll('#payOpts .pay-opt').forEach(el=>el.classList.remove('active')); event.currentTarget.classList.add('active'); const r=event.currentTarget.querySelector('input'); if(r)r.checked=true; }
function shipFee(){ const gi=document.getElementById("coGov").value; if(gi==="") return null; if(cartSubtotal()>=STORE.freeShipOver) return 0; return GOV[gi].fee; }
function renderCoSummary(){
  const fee=shipFee(); const sub=cartSubtotal();
  const feeTxt = fee===null?`<span class="muted">${t('shipAtCheckout')}</span>`:(fee===0?`<b style="color:var(--ok)">${t('freeShip')}</b>`:`<b>${money(fee)}</b>`);
  const total = sub + (fee||0);
  document.getElementById("coSummary").innerHTML = `
    <div class="sumline"><span>${t('subtotal')} (${cartCount()} ${cartCount()===1?t('item'):t('items')})</span><span>${money(sub)}</span></div>
    <div class="sumline"><span>${t('shipping')}</span>${feeTxt}</div>
    <div class="sumline total"><span>${t('total')}</span><span>${money(total)}</span></div>`;
}
function placeOrder(){
  const name=document.getElementById("coName"), phone=document.getElementById("coPhone"),
        gov=document.getElementById("coGov"), addr=document.getElementById("coAddr");
  let ok=true;
  [name,phone,gov,addr].forEach(f=>{ if(!f.value.trim()){ f.classList.add("err"); ok=false; } else f.classList.remove("err"); });
  const digits=(phone.value.match(/\d/g)||[]).length;
  if(phone.value.trim() && digits<10){ phone.classList.add("err"); ok=false; }
  if(!ok){ toast(lang==='ar'?'من فضلكِ أكملي البيانات':'Please complete the form'); return; }

  const gi=gov.value, fee=(cartSubtotal()>=STORE.freeShipOver?0:GOV[gi].fee), sub=cartSubtotal(), total=sub+fee;
  const orderNo = "AYL-"+Math.floor(100000+Math.random()*900000);
  const data={name:name.value.trim(),phone:phone.value.trim(),gov:GOV[gi],city:document.getElementById("coCity").value.trim(),addr:addr.value.trim(),notes:document.getElementById("coNotes").value.trim(),fee,sub,total,orderNo,pay:coPayment};
  const wa = buildWaLink(data);

  document.getElementById("coBody").innerHTML = `
    <div class="co-success">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2>${t('orderPlaced')}</h2>
      <p class="muted">${t('orderThanks')}</p>
      <div class="order-no">${t('yourOrder')}: ${orderNo}</div>
      <div class="sumline total" style="justify-content:center;gap:10px;border:none">${t('total')}: ${money(total)}</div>
      <p class="muted" style="font-size:14px;margin:14px 0 16px">${t('waHint')}</p>
      <a class="btn wa block" href="${wa}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2z"/></svg>
        ${t('sendWa')}</a>
      <button class="btn alt block" style="margin-top:10px" onclick="finishOrder()">${t('keepShopping')}</button>
    </div>`;
  cart=[]; save(); updateCartCount();
}
function buildWaLink(d){
  const lines = cart.map(i=>{const p=prod(i.id),info=P(p);return `• ${info.name}${i.color?` · ${t('color')}: ${colorName(i.color)}`:''} (${t('size')} ${i.size}) x${i.qty} = ${money(linePrice(i)*i.qty)}`;}).join("\n");
  const payLabel = {cod:t('cod'),wallet:t('wallet'),instapay:t('instapay'),card:t('cardDel')}[d.pay];
  const feeTxt = d.fee===0?t('freeShip'):money(d.fee);
  let m;
  if(lang==='ar'){
    m=`طلب جديد 💗 ${d.orderNo}\n\n${lines}\n\nالإجمالي الفرعي: ${money(d.sub)}\nالشحن (${d.gov.ar}): ${feeTxt}\nالإجمالي: ${money(d.total)}\n\nالاسم: ${d.name}\nالهاتف: ${d.phone}\nالمحافظة: ${d.gov.ar}\nالمنطقة: ${d.city}\nالعنوان: ${d.addr}\nملاحظات: ${d.notes||'-'}\nالدفع: ${payLabel}`;
  }else{
    m=`New order 💗 ${d.orderNo}\n\n${lines}\n\nSubtotal: ${money(d.sub)}\nShipping (${d.gov.en}): ${feeTxt}\nTotal: ${money(d.total)}\n\nName: ${d.name}\nPhone: ${d.phone}\nGovernorate: ${d.gov.en}\nArea: ${d.city}\nAddress: ${d.addr}\nNotes: ${d.notes||'-'}\nPayment: ${payLabel}`;
  }
  return `https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(m)}`;
}
function finishOrder(){ closeCheckout(); renderCart(); }
function closeCheckout(){ hideModal("checkoutModal"); }

/* ---------- size guide ---------- */
function openSize(){
  const rows=[["2-3","92-98","2-3"],["4-5","104-110","4-5"],["6-7","116-122","6-7"],["8-9","128-134","8-9"]];
  const h = lang==='ar'
    ? ["المقاس (بالسنة)","الطول (سم)","العمر التقريبي"]
    : ["Size (years)","Height (cm)","Approx. age"];
  document.getElementById("sizeBody").innerHTML = `
    <p class="muted" style="margin:0 0 12px;font-size:14px">${lang==='ar'?'كل قطعنا بمقاسات حسب عمر الطفلة من ٢ إلى ٩ سنوات. لو بين مقاسين، اختاري الأكبر. كل مقاس أكبر يزيد السعر '+SIZE_STEP+' ج.م. لمقاس مفصّل راسلينا على واتساب.':'All our pieces are sized by age, from 2 to 9 years. Between two sizes? Choose the larger. Each size up adds EGP '+SIZE_STEP+' to the price. For a custom fit, message us on WhatsApp.'}</p>
    <table class="sg-table"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table>
    <a class="btn wa block" style="margin-top:16px" href="https://wa.me/${STORE.whatsapp}" target="_blank" rel="noopener">${lang==='ar'?'اطلبي مقاساً مفصّلاً':'Request a custom size'}</a>`;
  showModal("sizeModal");
}
function closeSize(){ hideModal("sizeModal"); }

/* ---------- drawer / overlay / menu ---------- */
function openCart(){ renderCart(); document.getElementById("cartDrawer").classList.add("open"); document.getElementById("overlay").classList.add("show"); lockScroll(true); }
function closeCart(){ document.getElementById("cartDrawer").classList.remove("open"); maybeUnlock(); }
function openMenu(){ document.getElementById("mmenu").classList.add("open"); document.getElementById("overlay").classList.add("show"); lockScroll(true); }
function closeMenu(){ document.getElementById("mmenu").classList.remove("open"); maybeUnlock(); }
function showModal(id){ document.getElementById(id).classList.add("open"); lockScroll(true); }
function hideModal(id){ document.getElementById(id).classList.remove("open"); maybeUnlock(); }
function closeAll(){ document.querySelectorAll(".drawer,.modal,.mmenu").forEach(e=>e.classList.remove("open")); document.getElementById("overlay").classList.remove("show"); lockScroll(false); }
function maybeUnlock(){
  const anyOpen = document.querySelector(".drawer.open,.modal.open,.mmenu.open");
  if(!anyOpen){ document.getElementById("overlay").classList.remove("show"); lockScroll(false); }
}
function lockScroll(on){ document.body.style.overflow = on?"hidden":""; }

/* ---------- misc ---------- */
function subscribe(e){ e.preventDefault(); e.target.reset(); toast(t('newsThanks')); }
let toastTimer;
function toast(msg){
  const t2=document.getElementById("toastT");
  t2.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>${msg}`;
  t2.classList.add("show"); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t2.classList.remove("show"),2200);
}
document.addEventListener("keydown",e=>{
  const lb=document.getElementById("lightbox");
  if(lb.classList.contains("open")){ if(e.key==="Escape") closeLightbox(); if(e.key==="ArrowRight") lbStep(1); if(e.key==="ArrowLeft") lbStep(-1); return; }
  if(e.key==="Escape"){ if(document.querySelector(".drawer.open,.modal.open,.mmenu.open")) closeAll(); else if(document.body.classList.contains("pd-open")) backToShop(); }
});

/* ---------- init ---------- */
applyLang();
renderApp();
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
